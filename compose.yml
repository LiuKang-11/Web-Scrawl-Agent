services:
  backend:
    build: ./backend
    env_file: .env.local
    environment:
      FLOWGUARD_DB_PATH: /data/flowguard.db
      FLOWGUARD_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - flowguard-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  flowguard-data:
